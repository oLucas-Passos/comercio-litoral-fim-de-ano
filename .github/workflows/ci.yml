name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Testes
        run: pytest --cov=litoral --cov-report=term-missing
      - name: Executar pipeline completo
        if: hashFiles('data/raw/municipios_defrontantes_mar.csv') != ''
        run: python -m litoral
